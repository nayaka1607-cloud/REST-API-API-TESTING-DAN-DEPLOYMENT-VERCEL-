$kind: http-request
url: http://127.0.0.1:8000/api/v1/auth/login
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@example.com\",\r

    \  \"password\": \"Admin12345!\",\r

    \  \"device_name\": \"Postman Praktikum\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      pm.collectionVariables.set('admin_token', json.access_token);"
    language: text/javascript
order: 5000
